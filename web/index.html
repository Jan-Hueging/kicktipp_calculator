<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kicktipp Rechner</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Animated Background Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="container glass">
        <header>
            <h1>⚽ Kicktipp Batch Rechner</h1>
            <div class="mode-switch">
                <span class="mode-label active" id="label-einzel">Einzelne Spiele</span>
                <label class="switch">
                    <input type="checkbox" id="mode-toggle">
                    <span class="slider round"></span>
                </label>
                <span class="mode-label" id="label-uebersicht">Turnier Übersicht</span>
            </div>
        </header>

        <main>
            <div class="input-section glass-panel">
                <label for="url-input" id="url-label">Einzelne Spiel-Links hier einfügen:</label>
                <textarea id="url-input" placeholder="https://..."></textarea>
                
                <div class="settings-row">
                    <div class="setting-item">
                        <label>Exakt:</label>
                        <input type="number" id="pts-ex" value="4">
                    </div>
                    <div class="setting-item">
                        <label>Diff:</label>
                        <input type="number" id="pts-diff" value="3">
                    </div>
                    <div class="setting-item">
                        <label>Tendenz:</label>
                        <input type="number" id="pts-tend" value="2">
                    </div>
                </div>

                <button id="start-btn" disabled>Start</button>
            </div>

            <div class="progress-section" id="progress-container" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <p id="status-text">Warte auf Eingabe...</p>
            </div>

            <div class="results-grid" id="results-container">
                <!-- Cards will be injected here -->
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="selection-modal" class="modal glass-panel" style="display: none;">
        <div class="modal-content">
            <h2>Spiele auswählen</h2>
            <div class="select-all-container">
                <input type="checkbox" id="select-all"> <label for="select-all">Alle auswählen</label>
            </div>
            <div id="match-list" class="match-list custom-scrollbar"></div>
            <div class="modal-actions">
                <button id="cancel-selection-btn" class="btn-secondary">Abbrechen</button>
                <button id="confirm-selection-btn">Auswahl berechnen</button>
            </div>
        </div>
    </div>

    <div id="odds-modal" class="modal glass-panel" style="display: none;">
        <div class="modal-content">
            <h2 id="odds-match-title">Quoten</h2>
            <div id="odds-list" class="odds-list custom-scrollbar"></div>
            <button id="close-odds-btn" class="btn-secondary" style="margin-top: 20px; width: 100%;">Schließen</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
